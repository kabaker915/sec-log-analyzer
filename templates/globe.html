<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>攻击者地球</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='globe.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='typography.css') }}">
</head>
<body class="globe-body">

<header class="topbar">
  <div class="brand">
    <strong>攻击者地球</strong>
    {% if dry_run %}
    <span class="badge badge-warn">演练模式</span>
    {% else %}
    <span class="badge badge-danger">生效模式</span>
    {% endif %}
  </div>
  <div class="topbar-right">
    <a class="btn-ghost" href="{{ url_for('map_view') }}">2D 地图</a>
    <a class="btn-ghost" href="{{ url_for('dashboard') }}">返回控制台</a>
    <span class="muted">{{ user }}</span>
  </div>
</header>

<div id="stage">
  <div id="globe"></div>

  <aside id="panel">
    <h1>观测概览</h1>
    <p class="sub" id="generated">加载中…</p>

    <div class="stats">
      <div class="stat"><b id="s-ips">–</b><span>来源 IP</span></div>
      <div class="stat"><b id="s-countries">–</b><span>国家/地区</span></div>
      <div class="stat"><b id="s-window">–</b><span>窗口内来源</span></div>
    </div>

    <div class="legend">
      <div class="lg"><i class="dot bait"></i>站点特定诱饵 <b id="s-bait">0</b></div>
      <div class="lg"><i class="dot exploit"></i>尝试利用 <b id="s-exploit">0</b></div>
      <div class="lg"><i class="dot cloud"></i>云凭据探测 <b id="s-cloud">0</b></div>
      <div class="lg"><i class="dot scan"></i>扫描 / 探测 <b id="s-scan">0</b></div>
    </div>

    <h2>来源国家 / 地区</h2>
    <ol id="countries" class="countries"></ol>
    <p class="attr" id="attribution"></p>
  </aside>

  <!-- 控制条：日期 + 窗口 + 播放 + 自转 -->
  <div id="controls">
    <label class="ctl">
      <span>日期</span>
      <input type="date" id="dt-date">
    </label>
    <label class="ctl">
      <span>窗口</span>
      <select id="dt-window">
        <option value="1">1 小时</option>
        <option value="6">6 小时</option>
        <option value="24" selected>24 小时</option>
        <option value="72">3 天</option>
        <option value="168">7 天</option>
      </select>
    </label>
    <button id="dt-play" type="button">播放</button>
    <label class="ctl ctl-check">
      <input type="checkbox" id="dt-spin" checked>
      <span>自转</span>
    </label>
    <label class="ctl ctl-check">
      <input type="checkbox" id="dt-arcs" checked>
      <span>攻击线</span>
    </label>
    <span id="dt-label" class="ctl-label">–</span>
  </div>

  <aside id="detail" hidden>
    <button id="close-detail" aria-label="关闭">×</button>
    <h2 id="d-title">–</h2>
    <p class="sub" id="d-loc">–</p>
    <dl>
      <dt>请求数</dt><dd id="d-n">–</dd>
      <dt>首次</dt><dd id="d-first">–</dd>
      <dt>最近</dt><dd id="d-last">–</dd>
    </dl>
    <h3>来源</h3>
    <ul id="d-list" class="src-list"></ul>
  </aside>
</div>

<script>
  // 生产环境用本地资源；离线快照会把它改成 CDN 前缀。
  window.__ASSET_BASE__ = "{{ url_for('static', filename='vendor/globe') }}";
</script>
<script src="{{ url_for('static', filename='vendor/globe/globe.gl.min.js') }}"></script>
<script src="{{ url_for('static', filename='globe.js') }}" nonce="{{ nonce }}"></script>
</body>
</html>
