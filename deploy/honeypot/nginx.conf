server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # 日志格式：在 combined 基础上追加三项，这三项是做日志分析必需的
    #   $request_time      —— 服务端处理耗时，用来识别慢速攻击（RUDY/Slowloris）
    #   $http_x_forwarded_for —— 真实来源 IP（以后挂 CDN 时需要）
    #   $request_body      —— POST 内容，登录爆破的账号密码就靠它
    # 注意 $request_body 需要 client_body_buffer_size 足够大才会被记录，
    # 这里设成 16k，足够容纳常规表单提交。
    # -------------------------------------------------------------------------
    log_format hp escape=json
        '{"time":"$time_local",'
        '"ip":"$remote_addr",'
        '"xff":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"path":"$uri",'
        '"args":"$args",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"req_time":"$request_time",'
        '"body":"$request_body"}';

    access_log /var/log/nginx/access.log hp;
    error_log  /var/log/nginx/error.log warn;

    # 关闭版本号，减少指纹暴露（虽然很弱，但成本为 0）
    server_tokens off;

    # 限制请求体，防止有人上传大文件打满磁盘
    client_max_body_size 1m;
    client_body_buffer_size 16k;

    # -------------------------------------------------------------------------
    # 站点本身
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # -------------------------------------------------------------------------
    # 假登录页 → 转给 php-fpm
    # 目的只有一个：接收爆破请求并记录
    # -------------------------------------------------------------------------
    location /admin/ {
        index login.php;
        try_files $uri =404;
    }

    location ~ \.php$ {
        # root 指到 php 容器实际挂载点，两容器共享同一个 ./site 目录，
        # 所以路径在这里可以保持一致
        root /var/www/html;
        fastcgi_pass login:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REQUEST_BODY $request_body;
        fastcgi_read_timeout 10s;

        # 登录相关路径只允许 POST 和 GET，其他方法（PUT/DELETE）直接拒绝，
        # 减少被当作漏洞利用入口的面
        limit_except GET POST {
            deny all;
        }
    }

    # -------------------------------------------------------------------------
    # 静态资源缓存（正常站点该有的，也让流量看起来更"真实"）
    # -------------------------------------------------------------------------
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # -------------------------------------------------------------------------
    # 显式拒绝访问隐藏文件（.git / .env 等）
    # 注意：这里仍然记日志——这正是我们要收集的探测行为。
    # 真实的"防护"和"记录"不冲突：拒绝访问，但保留证据。
    # -------------------------------------------------------------------------
    location ~ /\. {
        access_log /var/log/nginx/access.log hp;
        return 403;
    }
}
